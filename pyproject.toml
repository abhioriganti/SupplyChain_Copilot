[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplychain-copilot"
version = "0.1.0"
description = "Enterprise AI agent for supply-chain analytics and supplier knowledge retrieval on Snowflake Cortex (portfolio project)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "snowflake-connector-python>=3.12,<5",
    "python-dotenv>=1.0,<2",
    "cryptography>=42",
    "PyJWT>=2.8,<3",
    "requests>=2.31,<3",
    "pandas>=2.2,<3",
    "streamlit>=1.40,<2",
    "pymupdf>=1.24,<2",
    "plotly>=5.24,<7",  # AGPL-3.0: fine for this portfolio project; review before commercial use
    "fastapi>=0.115,<1",  # Phase 9: callback API for the n8n approval workflow
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
    "httpx>=0.27,<1",  # FastAPI TestClient
    "scikit-learn>=1.5,<2",  # late-delivery risk model training/tests (ADR-032)
]
# Training + Snowflake Model Registry (not needed by the app or CI): pip install -e ".[ml]"
ml = [
    "snowflake-ml-python[scikit-learn]>=2.5,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "snowflake: integration test that needs a live Snowflake connection (skipped unless SCC_RUN_SNOWFLAKE_TESTS=1)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # asserts are fine in tests
    "E501",  # line length is handled by `ruff format`; long strings/SQL are left intact
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S608"]  # identifiers come from validated config, not user input
"src/supplychain_copilot/semantic/validate_view.py" = ["S608"]  # SQL built only from module constants
"src/supplychain_copilot/documents/load.py" = ["S608"]  # SQL built only from module constants
"src/supplychain_copilot/evaluation/redteam.py" = ["S608"]  # constant identifiers; attack text is bound
"src/supplychain_copilot/ui/data.py" = ["S608"]  # constants + bound placeholders only
"src/supplychain_copilot/ui/feedback.py" = ["S608"]  # constant column list + bound values
"src/supplychain_copilot/observability.py" = ["S608"]  # constant column list + bound values
