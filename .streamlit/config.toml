[client]
# Never show Python tracebacks (which could include paths or connection details) in the browser.
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false

# Light, neutral enterprise theme (deliberately not any company's brand colours).
[theme]
base = "light"
# Inter from Google Fonts; falls back to the system sans-serif offline.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseFontSize = 15
primaryColor = "#0F6E8C"
backgroundColor = "#F4F7FA"
secondaryBackgroundColor = "#EDF2F7"
textColor = "#1E293B"
linkColor = "#0F6E8C"
borderColor = "#E2E8F0"
showWidgetBorder = true
baseRadius = "0.65rem"
buttonRadius = "0.65rem"
metricValueFontWeight = 700
metricValueFontSize = "1.85rem"
dataframeHeaderBackgroundColor = "#EAF1F6"
chartCategoricalColors = ["#0F6E8C", "#E07A5F", "#2A9D8F", "#E9B949", "#6D597A"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F6F9"
