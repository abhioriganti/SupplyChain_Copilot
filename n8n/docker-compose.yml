# Phase 9: local n8n for the SIMULATED supplier-incident approval workflow.
#
#   docker compose --env-file .env -f n8n/docker-compose.yml up -d      (run from the project root)
#
# * Image pinned to n8n 2.47.5 (stable, released 2026-11-12). Bump deliberately.
# * Bound to 127.0.0.1 only. The callback API runs on the host (127.0.0.1:8077) and is reached
#   from the container as host.docker.internal.
# * The shared secret SCC_WORKFLOW_TOKEN is read from the project .env (gitignored) and passed in
#   as an environment variable; it is never stored in the workflow JSON. n8n 2.x blocks $env in
#   expressions by default, so N8N_BLOCK_ENV_ACCESS_IN_NODE=false is required. This container's
#   environment holds only n8n settings and that token.
services:
  n8n:
    image: docker.io/n8nio/n8n:2.47.5
    container_name: scc-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SCC_WORKFLOW_TOKEN: ${SCC_WORKFLOW_TOKEN:?set SCC_WORKFLOW_TOKEN in .env}
      SCC_INCIDENT_API: http://host.docker.internal:8077
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  n8n-data:
